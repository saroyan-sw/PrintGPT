[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printgpt-alignment"
version = "0.1.0"
description = "A4 calibration, detection, rectification, and alignment benchmarking for PrintGPT"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "numpy",
    "opencv-contrib-python-headless",
    "Pillow",
    "pydantic>=2.7,<3",
    "pypdfium2>=4.30",
    "reportlab",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.1",
    "matplotlib>=3.10",
    "pandas>=2.2",
]
app = [
    "streamlit>=1.50,<2",
]
gemini = [
    "google-genai==2.31.0",
]
gmail = [
    "google-api-python-client>=2.150,<3",
    "google-auth>=2.35,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
printgpt-align = "printgpt_alignment.cli:main"
printgpt-mvp-demo = "printgpt_mvp.example:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
